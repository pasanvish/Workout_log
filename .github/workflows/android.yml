name: Android APK

on:
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', 'package*.json', 'exerciseCatalogue.json', '.github/workflows/android.yml', '.github/scripts/check-android-page-size.py', '*.tsx', '*.ts', '*.css', 'index.html', 'components/**', 'public/**', '*config.js']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', 'capacitor.config.ts', 'package*.json', 'exerciseCatalogue.json', '.github/workflows/android.yml', '.github/scripts/check-android-page-size.py', '*.tsx', '*.ts', '*.css', 'index.html', 'components/**', 'public/**', '*config.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: node --test localAi.test.ts exerciseVisuals.test.ts
      - run: npm run build
      - run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/GymLogger.apk"

      - name: Verify 16 KB native library alignment
        run: python3 .github/scripts/check-android-page-size.py GymLogger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GymLogger-apk
          path: GymLogger.apk

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" GymLogger.apk \
            --title "Gym Logger ${{ github.ref_name }}" \
            --notes "Download **GymLogger.apk** below and open it on your Android phone. You may need to allow your browser to install unknown apps. Your data stays on your phone; use History → Export → Full backup to move it from the web version."
